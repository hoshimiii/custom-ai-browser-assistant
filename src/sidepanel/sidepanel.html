<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">AI</div>
        <div class="brand-copy">
          <h1>AI Assistant</h1>
          <select id="modelSelect" aria-label="当前模型"></select>
          <span id="modelStatus" class="model-status">Not configured</span>
        </div>
      </div>
      <button id="openOptions" class="icon-button" title="Settings" type="button" aria-label="Settings">⚙</button>
    </header>

    <div class="workspace">
      <section class="context-panel" aria-label="Current context">
          <div class="primary-actions" aria-label="主要操作">
            <button id="summarizePage" class="primary-action" type="button">总结</button>
            <button id="readPage" class="primary-action" type="button">朗读</button>
            <button id="selectRegion" class="primary-action" type="button">选区域</button>
            <button id="clearRegion" class="primary-action" type="button" disabled>清除选择</button>
          </div>
          <section id="ttsStatus" class="tts-status" aria-live="polite" hidden>
            <div class="tts-status-row">
              <strong id="ttsMessage">准备朗读</strong>
              <button id="stopTts" type="button" disabled>停止朗读</button>
            </div>
            <progress id="ttsProgress" value="0" max="1">0%</progress>
            <audio id="ttsAudio" controls preload="metadata" aria-label="朗读播放器"></audio>
          </section>
      </section>

      <details class="more-tools">
        <summary>更多工具</summary>
        <div class="tool-stack">
          <section class="quick-actions" aria-label="Assistant actions">
            <div class="action-group">
              <div class="section-heading">
                <h2>网页</h2>
                <span>Ctrl+Shift+S</span>
              </div>
              <div id="pageActions" class="action-grid"></div>
            </div>
            <div class="action-group">
              <h2>视觉</h2>
              <div class="action-grid">
                <button id="askScreenshot" type="button">截图问答</button>
              </div>
            </div>
            <div class="action-group">
              <h2>写作</h2>
              <div id="writingActions" class="action-grid"></div>
            </div>
          </section>

          <section class="secondary-context" aria-label="上下文与截图工具">
            <div class="context-actions">
              <button id="refreshContext" type="button">刷新上下文</button>
              <button id="hideTranslations" type="button">隐藏译文</button>
              <button id="showTranslations" type="button">显示译文</button>
              <button id="clearTranslations" type="button">清除译文</button>
            </div>
            <div id="screenshotPanel" class="screenshot-panel" hidden>
              <img id="screenshotPreview" alt="当前页面截图预览">
              <div class="screenshot-actions">
                <button id="sendScreenshotQuestion" type="button">发送截图问题</button>
                <button id="analyzeScreenshot" type="button">直接分析</button>
                <button id="retakeScreenshot" type="button">重新截图</button>
                <button id="clearScreenshot" type="button">取消截图</button>
              </div>
            </div>
          </section>

        <section class="history-panel" aria-label="Conversation history">
          <div class="history-header">
            <strong>历史</strong>
            <div class="inline-actions">
              <button id="refreshHistory" type="button">刷新</button>
              <button id="clearStoredHistory" type="button">清空记录</button>
            </div>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>

        <section class="library-panel" aria-label="Saved pages">
          <div class="history-header">
            <strong>资料库</strong>
            <button id="saveCurrentPage" type="button">保存当前页</button>
          </div>
          <input id="librarySearch" class="library-search" placeholder="搜索已保存资料">
          <div id="libraryList" class="history-list"></div>
        </section>
          </div>
      </details>

      <main id="messages" class="messages" aria-live="polite"></main>
    </div>

    <form id="composer" class="composer">
      <div id="contextTagRow" class="context-tag-row" hidden>
        <button id="contextTag" class="context-tag" type="button" aria-pressed="false"></button>
      </div>
      <textarea id="promptInput" rows="3" placeholder="输入问题，网页内容可按需附加"></textarea>
      <div class="composer-actions">
        <button id="clearChat" type="button">清空</button>
        <button id="stopChat" type="button" disabled>停止</button>
        <button id="sendPrompt" class="primary-button" type="submit">发送</button>
      </div>
    </form>

    <template id="messageTemplate">
      <article class="message">
        <div class="role"></div>
        <div class="content"></div>
      </article>
    </template>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
