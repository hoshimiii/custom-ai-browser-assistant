<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Assistant Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>AI Assistant Settings</h1>
      <form id="settingsForm">
        <label>
          <span>Provider Preset</span>
          <select id="providerPreset" name="providerPreset"></select>
        </label>
        <label>
          <span>API Base URL</span>
          <input id="baseUrl" name="baseUrl" placeholder="https://api.example.com/v1" autocomplete="off">
        </label>
        <label>
          <span>API Key</span>
          <input id="apiKey" name="apiKey" type="password" placeholder="sk-..." autocomplete="off">
        </label>
        <label>
          <span>Model</span>
          <input id="model" name="model" placeholder="your-model-name" autocomplete="off">
        </label>
        <label>
          <span>Target Language</span>
          <input id="targetLanguage" name="targetLanguage" placeholder="中文">
        </label>
        <label>
          <span>Timeout Seconds</span>
          <input id="timeoutSeconds" name="timeoutSeconds" type="number" min="10" max="600" step="10">
        </label>
        <label>
          <span>Page Chunk Size</span>
          <input id="pageChunkChars" name="pageChunkChars" type="number" min="4000" max="30000" step="1000">
        </label>
        <label class="checkbox">
          <input id="stream" name="stream" type="checkbox">
          <span>Stream responses</span>
        </label>
        <label class="checkbox">
          <input id="saveHistory" name="saveHistory" type="checkbox">
          <span>Save conversation history locally</span>
        </label>
        <label>
          <span>System Prompt</span>
          <textarea id="systemPrompt" name="systemPrompt" rows="4"></textarea>
        </label>
        <fieldset class="tts-settings">
          <legend>Text to Speech</legend>
          <label>
            <span>TTS Base URL</span>
            <input id="ttsBaseUrl" name="ttsBaseUrl" placeholder="留空则使用 API Base URL" autocomplete="off">
          </label>
          <label>
            <span>TTS API Key</span>
            <input id="ttsApiKey" name="ttsApiKey" type="password" placeholder="留空则使用 API Key" autocomplete="off">
          </label>
          <label>
            <span>TTS Model</span>
            <input id="ttsModel" name="ttsModel" placeholder="例如 tts-1" autocomplete="off">
          </label>
          <label>
            <span>Voice</span>
            <input id="ttsVoice" name="ttsVoice" placeholder="alloy" autocomplete="off">
          </label>
          <label>
            <span>Speed</span>
            <input id="ttsSpeed" name="ttsSpeed" type="number" min="0.25" max="4" step="0.05">
          </label>
          <label>
            <span>TTS Timeout Seconds</span>
            <input id="ttsTimeoutSeconds" name="ttsTimeoutSeconds" type="number" min="1" max="600" step="1">
          </label>
        </fieldset>
        <div class="actions">
          <button id="testConnection" type="button">Test</button>
          <button type="submit">Save</button>
        </div>
      </form>
      <section class="backup-panel">
        <h2>Backup</h2>
        <p>Export or import local settings, conversation history, and saved pages.</p>
        <div class="actions">
          <button id="exportBackup" type="button">Export JSON</button>
          <label class="checkbox">
            <input id="includeApiKeyInBackup" type="checkbox">
            <span>Include API Keys in exported JSON</span>
          </label>
          <label class="file-button">
            Import JSON
            <input id="importBackup" type="file" accept="application/json">
          </label>
          <label class="checkbox">
            <input id="replaceOnImport" type="checkbox">
            <span>Replace existing data</span>
          </label>
        </div>
        <p class="warning-text">API Keys 默认不会导出。只有勾选上方选项时，导出的 JSON 才会包含聊天和 TTS API Key。</p>
      </section>
      <section class="shortcut-panel">
        <h2>Shortcuts</h2>
        <dl>
          <div>
            <dt>打开助手</dt>
            <dd>Ctrl+Shift+M</dd>
          </div>
          <div>
            <dt>总结当前页</dt>
            <dd>Ctrl+Shift+S</dd>
          </div>
        </dl>
        <p>如果快捷键冲突，可以在 Chrome 地址栏打开 <code>chrome://extensions/shortcuts</code> 修改。</p>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
